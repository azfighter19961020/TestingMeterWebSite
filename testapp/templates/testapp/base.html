<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Test App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" defer></script>
    <style>
        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        .app-sidebar {
            flex: 0 0 240px;
            background-color: #00DB00;
        }

        .app-sidebar .nav-link {
            color: #102510;
            font-weight: 600;
        }

        .app-sidebar .nav-link:hover,
        .app-sidebar .nav-link:focus {
            background-color: rgba(255, 255, 255, 0.35);
        }

        .app-content {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 767.98px) {
            .app-shell {
                flex-direction: column;
            }

            .app-sidebar {
                flex-basis: auto;
            }

            .app-sidebar .nav {
                flex-direction: row !important;
                flex-wrap: nowrap;
                overflow-x: auto;
            }

            .app-sidebar .nav-link {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="app-sidebar p-3" aria-label="主要導覽">
            <nav class="nav flex-column">
                <a class="nav-link rounded-2" href="{% url 'home' %}">首頁</a>
                <a class="nav-link rounded-2" href="{% url 'live_value' %}">即時數值顯示</a>
                <span class="px-3 py-2 fs-5 fw-bold">圖表分析</span>
                <a class="nav-link rounded-2" href="{% url 'kwh_range' %}">kWh區間顯示</a>
            </nav>
        </aside>
        <div class="app-content">
            {% block content %}{% endblock %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
