<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<main class="container-fluid d-flex align-items-start justify-content-center py-4"
      style="max-width: 1920px; min-height: 1080px; font-family: Arial, sans-serif;">
    <section class="card shadow-sm rounded-4 w-100" style="max-width: 420px;">
        <div class="card-body p-4">
            <h1 class="h3 text-center mb-4">Login</h1>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       autocomplete="current-password">
            </div>
            <div class="text-center">
                <button type="button" class="btn btn-primary" id="login_button">Login</button>
            </div>
        </div>
    </section>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    $(function () {
        $("#login_button").on("click", function () {
            $.ajax({
                url: "{% url 'login' %}",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    username: $("#username").val(),
                    password: $("#password").val()
                }),
                success: function (response) {
                    if (response.message === "Login Successful" && response.user_id) {
                        Swal.fire({
                            icon: "success",
                            title: "Login successful",
                            text: "You are now logged in.",
                            confirmButtonText: "Go to home"
                        }).then(function (result) {
                            if (result.isConfirmed) {
                                window.location.href = "{% url 'home' %}";
                            }
                        });
                    } else {
                        Swal.fire({
                            icon: "error",
                            title: "Login failed",
                            text: "Unexpected login response."
                        });
                    }
                },
                error: function (xhr) {
                    const message = xhr.responseJSON && xhr.responseJSON.error
                        ? xhr.responseJSON.error
                        : "Login request failed.";
                    Swal.fire({
                        icon: "error",
                        title: "Login failed",
                        text: message
                    });
                }
            });
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYJ3YlHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
